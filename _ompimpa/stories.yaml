# Daftar User Stories Terurut Topologis — Panen agyimpa → ompimpa
# Dihasilkan dari ADR-001 & BALAIRUNG-20260902-panen-agyimpa-review-sync.md
# Generator: H. Agus Salim (ompimpa-prd) — MADR 3.0+
# Scoring: v2 — 35-Row Registry, 100/100 PASS, dedup hash file:line:ruleId
# Isolation: task isolated:true, worktree ~/.omp/wt/
# Tier: T1 <2s (compile+format), T2 <10s (test --stale + review), T3 background (full+credo+sobelow)

epics:
  - id: EPIC-A
    title: "Governance Spine — Fondasi Deterministik"
    description: "Menegakkan 26 Laws 1:1, DAG stories, dan registry 35 baris sebagai single source of truth scoring."
  - id: EPIC-B
    title: "Isolated Review & Triage — Inti Mutu Closed-Loop"
    description: "Mengubah review inline→7→10 isolated, dedup hash, tiered verify, dan circuit breaker 3."
  - id: EPIC-C
    title: "Knowledge & DX — Akselerator Institusional"
    description: "Graph blast-radius, deferred+sweep, pitfalls, wizard, docs generator, inspeksi 4-pilar."
  - id: EPIC-D
    title: "Outer Loop Driver & Command Modularization — Dekomposisi Fase & Eksekusi Otonom"
    description: "Memecah /dev menjadi perintah fase atomik (/story, /atdd, /code, /review, /triage) dan outer CLI driver."
  - id: EPIC-E
    title: "In-Band TEA & Master Diagnostic — Mutu Asersi & Unifikasi /inspect"
    description: "Traceability TEA-01, flaky/mutation guard, dan unifikasi audit ke /ompimpa:inspect."

stories:
  - id: A-01
    epic: EPIC-A
    title: "Pecah 26 Iron Laws Agregat → 26 File 1:1 TTSR per-Law"
    description: |
      Saat ini rules/elixir-iron-laws.md agregat 6.3KB + 15 rules/elixir-*.md tidak 1:1 dengan 26 Laws.
      Story ini memecah menjadi 26 file terpisah rules/01-no-float-money.md … rules/26-pure-code-comments.md,
      sinkron dengan .agents/rules/iron-laws/01..26.md agyimpa, agar TTSR inject per-law & reviewer audit per-hash.
    tea_tier: "P0"
    priority: "P0"
    depends_on: []
    target_files:
      - "rules/01-no-float-money.md"
      - "rules/02-no-disconnected-mount-queries.md"
      - "rules/03-mandatory-streams.md"
      - "rules/04-no-raw-sql-interpolation.md"
      - "rules/05-pubsub-check-connected.md"
      - "rules/06-explicit-changeset-error-handling.md"
      - "rules/07-no-assign-new-for-dynamic-data.md"
      - "rules/08-check-changeset-errors-before-form-debug.md"
      - "rules/09-separate-has-many-use-join-belongs-to.md"
      - "rules/10-no-implicit-cross-join.md"
      - "rules/11-dedup-shared-data-before-cast-assoc.md"
      - "rules/12-hidden-inputs-for-embedded-schemas.md"
      - "rules/13-oban-jobs-idempotent-unique.md"
      - "rules/14-oban-string-keys-args.md"
      - "rules/15-no-structs-in-oban-args.md"
      - "rules/16-oban-smart-engine-snooze-guard.md"
      - "rules/17-no-string-to-atom-user-input.md"
      - "rules/18-mandatory-auth-handle-event.md"
      - "rules/19-no-raw-dynamic-content.md"
      - "rules/20-otp-process-spawning-justification.md"
      - "rules/21-supervised-long-lived-processes.md"
      - "rules/22-external-resource-compile-time.md"
      - "rules/23-facade-third-party-apis.md"
      - "rules/24-mix-tasks-minimal-app-start.md"
      - "rules/25-capture-locale-before-spawning.md"
      - "rules/26-pure-code-comments-and-verification.md"
      - "rules/elixir-iron-laws.md # legacy, akan di-deprecate setelah 26 file stabil"
      - "src/prewalk.ts"
      - "test/ttsr_rules.test.ts"
      - "test/prewalk_and_reviewer.test.ts"
    ac:
      - id: AC-A01-1
        given: "rules/ berisi 26 file 01..26 terpisah sinkron dengan agyimpa 01..26"
        when: "bun test test/ttsr_rules.test.ts dijalankan"
        then: "loadPrewalkRules() load 26 rules, tiap ruleId 1:1 dengan Iron Law, tidak ada duplikat"
      - id: AC-A01-2
        given: "kode mengandung field :balance, :float"
        when: "TTSR stream mengintersepsi write_file/edit_file"
        then: "rule 01-no-float-money abort dengan remediation 'gunakan :decimal atau integer cents' di line tepat"
      - id: AC-A01-3
        given: "legacy rules/elixir-iron-laws.md masih ada"
        when: "A-01 selesai"
        then: "file legacy ditandai deprecated (header > DEPRECATED: use rules/01..26) tidak dihapus dulu untuk backward compat"
    kill_criteria:
      - "Jika inject 26 file >8k token → revert ke lazy-load per-law (load on-demand by ruleId)"
    estimate: "S"
    scoring_impact: "TEA-17, TEA-08, TEA-12, TEA-22"

  - id: A-02
    epic: EPIC-A
    title: "Stories YAML DAG Topologis + Kill Criteria Eksplisit"
    description: |
      Buat stories.yaml sebagai DAG terurut topologis bebas circular, port dari agyimpa _bmad-output/planning-artifacts/stories.yaml
      (depends_on[] + tea_tier + target_files + ac_keys), plus kill_criteria per story.
      Validasi circular via prewalk (mix xref atau graph traversal) dan simpan feature-status.yaml untuk dev loop.
    tea_tier: "P0"
    priority: "P0"
    depends_on: ["A-01"]
    target_files:
      - "_ompimpa/stories.yaml # canonical"
      - "_ompimpa/status/feature-status.yaml # dev loop state"
      - "_ompimpa/status/stories.yaml # symlink/compat"
      - "templates/ompimpa.toml # tambah [stories] kill_criteria"
      - "src/prewalk.ts # tambah checkCircularDAG()"
      - "src/cli.ts # handleInit tulis stories.yaml jika belum ada"
      - "test/stories_dag.test.ts # baru"
    ac:
      - id: AC-A02-1
        given: "stories.yaml berisi 14 story A-01..C-06 dengan depends_on DAG"
        when: "bun test stories_dag: checkCircularDAG() dijalankan"
        then: "tidak ada siklus, topological sort = A-01→A-02→A-03→B-01→B-02→C-01→B-03→B-04→B-05→C-02→C-03→C-04→C-05→C-06"
      - id: AC-A02-2
        given: "story A-02 depends_on [A-01] dan A-01 belum done"
        when: "ompimpa dev --story A-02 dipanggil"
        then: "CLI blok dengan pesan 'Blocked: dependency A-01 not done' (exit 1)"
      - id: AC-A02-3
        given: "kill_criteria terdefinisi di stories.yaml per story"
        when: "docs PRD dirender"
        then: "kill_criteria tampil di _ompimpa/prd/ dan di LSP hover"
    kill_criteria:
      - "Jika DAG check >500ms di 100 story → cache di _ompimpa/.cache/dag.json"
    estimate: "S"
    scoring_impact: "TEA-16, TEA-15"

  - id: A-03
    epic: EPIC-A
    title: "Port 35-Row Criteria Registry 100/100 — Single Source of Truth Scoring"
    description: |
      Port .agents/data/criteria_registry_35.json agyimpa (5 dimensi, 35 kriteria, penalti -30/-15/-5/-2)
      ke _ompimpa/criteria_registry_35.json + _ompimpa/data/criteria_registry_35.json dengan mapping
      reviewer_sources → ompimpa_panel (ompimpa-ironlaw, security, test, verify, ash, liveview, prd).
      Ubah scoring di src/reviewer.ts:calculateScorecard() dari floor 90 (-25/-10/-3) ke v2 100 (-30/-15/-5/-2), PASS hanya 100.
    tea_tier: "P1"
    priority: "P0"
    depends_on: ["A-01"]
    target_files:
      - "_ompimpa/criteria_registry_35.json # canonical, sudah ter-port"
      - "_ompimpa/data/criteria_registry_35.json # compat"
      - "src/reviewer.ts # calculateScorecard v2"
      - "src/triage.ts # baru, dedup + scoring"
      - "test/prewalk_and_reviewer.test.ts # update floor 100"
      - "test/triage.test.ts # baru, port dari test_triage.py 21 tests"
      - "templates/ompimpa.toml # quality_score_floor 90→100, scoring_version=v2"
    ac:
      - id: AC-A03-1
        given: "_ompimpa/criteria_registry_35.json berisi 35 kriteria TEA-01..35"
        when: "src/triage.ts loadRegistry() dipanggil"
        then: "35 entries valid, tiap id unik, penalty sesuai registry, ompimpa_panel ter-mapping"
      - id: AC-A03-2
        given: "1 Critical (-30) + 1 High (-15)"
        when: "calculateScorecard() v2 dijalankan"
        then: "score = 55, verdict REMEDIATE, P0=1 P1=1"
      - id: AC-A03-3
        given: "0 temuan"
        when: "calculateScorecard() v2 dijalankan"
        then: "score 100/100 PASS, allow_p2_nits=false tetap BLOCK jika ada Low"
    kill_criteria:
      - "Jika floor 100 bikin story lama yang lulus 90 jadi BLOCKED → fallback scoring_version=v1 via flag"
    estimate: "M"
    scoring_impact: "TEA-29, TEA-30, ADR-001 INV-03"

  - id: B-01
    epic: EPIC-B
    title: "Dispatch 7 Isolated Reviewers via task isolated:true (DUAL-REVIEW)"
    description: |
      Ubah src/reviewer.ts:runReview() dari inline runPrewalkScan() menjadi dispatchIsolatedReview(panel)
      via OMP task isolated:true — 7 subagent: 1 spec (ompimpa-prd H. Agus Salim) + 6 tech
      (ironlaw Rasuna Said, security Azizchan, test Imam Bonjol, verify, ash/ecto, liveview/oban).
      Tiap reviewer tulis _ompimpa/review/<story>-<reviewer>.json (severity/file/line/rule_violation/recommendation).
      Aggregator tunggu 7 JSON baru lanjut triage. Enforce INV-01 Anti-Inline.
    tea_tier: "P0"
    priority: "P0"
    depends_on: ["A-03"]
    target_files:
      - "src/reviewer.ts # dispatchIsolatedReview()"
      - "src/triage.ts # aggregateReviews()"
      - "_ompimpa/review/ # output dir"
      - "agents/ompimpa-prd.md # spec reviewer prompt"
      - "agents/ompimpa-ironlaw.md # tech"
      - "agents/ompimpa-security.md"
      - "agents/ompimpa-test.md"
      - "hooks/ompimpa-guard.ts # guard review isolation"
      - "test/reviewer_isolated.test.ts # baru"
    ac:
      - id: AC-B01-1
        given: "story in-progress dan panel 7 aktif"
        when: "dispatchIsolatedReview() dipanggil"
        then: "7 task isolated:true ter-spawn, tiap tulis JSON valid {severity,file,line,rule_violation,recommendation} atau []"
      - id: AC-B01-2
        given: "1 reviewer crash/tidak tulis JSON"
        when: "aggregateReviews() timeout 60s"
        then: "triage catat P1 High 'reviewer missing' bukan crash, lanjut dedup yang ada"
      - id: AC-B01-3
        given: "runReview() dipanggil tanpa dispatch"
        when: "prewalk scan detect INV-01 violation"
        then: "P0 Blocker 'Review must be isolated via task'"
    kill_criteria:
      - "Jika 7 task >12s (T1+T2) → fallback parallel_reviewers=4 via config"
    estimate: "M"
    scoring_impact: "TEA-01, TEA-29, ADR-001 INV-01"

  - id: B-02
    epic: EPIC-B
    title: "Triage Dedup Hash file:line:ruleId + Remediation Plan P0→P1→P2"
    description: |
      Port triage_collector.py 29KB agyimpa ke src/triage.ts TS native:
      dedup per file:line:ruleId keep severity tertinggi (Critical>High>Medium>Low),
      mapping ke 35-Row registry, scoring 100, sorted P0→P1→P2, verdict PASS/REMEDIATE,
      remediation plan actionable. Port test_triage.py 21 tests → bun:test.
    tea_tier: "P0"
    priority: "P0"
    depends_on: ["B-01"]
    target_files:
      - "src/triage.ts # deduplicateFindings(), calculateScore(), remediationPlan()"
      - "_ompimpa/criteria_registry_35.json # lookup penalty"
