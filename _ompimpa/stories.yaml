        when: "loop jalan"
        then: "langsung REMEDIATE tanpa T2 (hemat 10s)"
    kill_criteria:
      - "Jika T1+T2 >12s di laptop i5-8250U → cache compile atau skip T2 stale"
    estimate: "S"
    scoring_impact: "TEA-26, ADR-001 INV-05"

