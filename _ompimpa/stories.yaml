    priority: "P1"
    depends_on: ["A-02"]
    target_files:
      - "templates/ompimpa.toml # [quality.verify] tier1/tier2/tier3"
      - "src/cli.ts # handleVerify tiered"
      - "hooks/ompimpa-guard.ts # session_stop tiered"
